<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Big Things are Coming</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            font-size: 1.25rem;
            margin: 2rem;
            line-height: 1.5;
            background: #F8E9E9;
            color: #3b2f2f;
        }
        h1 {
            font-size: 2.5rem;
        }
        .card {
            background: #EDB6A3;
            padding: 1.5rem;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 1rem;
            color: inherit;
        }
        .card h1 {
            margin-bottom: 0.5rem;
            color: inherit;
        }
        .card p {
            margin-bottom: 0.5rem;
            color: inherit;
        }
        .melon {
            background: #E5967E;
            color: #F8E9E9;
        }
        .green {
            background: #204635;
            color: #F8E9E9;
        }
        .purple {
            background: #211E34;
            color: #F8E9E9;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
        }
        button {
            position: relative;
            background: #204635;       /* base button color */
            color: #F8E9E9;
            font-size: 1.5rem;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 12px;       /* rounded rectangle */
            cursor: pointer;
            overflow: hidden;
        }

        /* the "groove pill" */
        button::before {
            content: "";
            position: absolute;
            top: 13%;                  /* centered vertically */
            left: 7%;
            right: 7%;
            height: 74%;               /* pill height */
            border-radius: 999px;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.20),       /* shadow at top */
                rgba(255,255,255,0.20)  /* highlight at bottom */
            );
            pointer-events: none;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(0,0,0,0.25);
        }
    </style>
</head>
<body>
    <div class="card green">
        <h1>Hello World 👋</h1>
    </div>
    <div class="card purple">
        <p>Big things are coming.</p>
    </div>
    <div class="card melon">
        <p>✨ <em>web dev is my passion</em> ✨</p>
    </div>
    <div class="card">
        <h1 id="message">apa</h1>
        <button onclick="toggleText()"><em>bepa apa</em></button>
    </div>

    <script>
    const phrases = [
        "apa",
        "bepa",
        "cepa",
        "depa",
        "epa",
        "efpa",
        "gepa",
        "håpa",
        "ipa",
        "jipa",
        "kåpa",
        "elpa",
        "empa",
        "enpa",
        "opa",
        "pepa",
        "qupa",
        "ärpa",
        "espa",
        "tepa",
        "upa",
        "vepa",
        "dubbelvepa",
        "expa",
        "ypa",
        "zätapa",
        "åpa",
        "äpa",
        "öpa"
    ];
    let index = 0;

    function toggleText() {
        const msg = document.getElementById('message');
        index = (index + 1) % phrases.length; // go to next, wrap around
        msg.textContent = phrases[index];
    }
</script>


</body>
</html>
